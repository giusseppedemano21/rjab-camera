<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>RJAB Camera</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

    <!-- HEADER -->

    <header>

        <h1>RJAB Camera</h1>

        <p class="subtitle">
            Photo Verification
        </p>

    </header>

    <!-- CAMERA -->

    <div class="camera-box">

        <video
            id="camera"
            autoplay
            playsinline
            muted>
        </video>

        <canvas
            id="canvas"
            hidden>
        </canvas>

        <img
            id="preview"
            hidden>

        <!-- FACE GUIDE -->
        <div id="guide"></div>

        <!-- COUNTDOWN -->
        <div id="countdown" hidden>
            3
        </div>

        <!-- FLASH EFFECT -->
        <div id="flash"></div>

    </div>

    <!-- STATUS -->

    <div id="status">

        Loading camera...

    </div>

    <!-- BUTTONS -->

    <div class="buttons">

        <button id="captureBtn">

<svg
    width="42"
    height="42"
    viewBox="0 0 24 24"
    fill="none"
    xmlns="http://www.w3.org/2000/svg">

    <path
        d="M8 5L9.5 3H14.5L16 5H20C20.55 5 21 5.45 21 6V19C21 19.55 20.55 20 20 20H4C3.45 20 3 19.55 3 19V6C3 5.45 3.45 5 4 5H8Z"
        fill="white"/>

    <circle
        cx="12"
        cy="12.5"
        r="4"
        fill="#2563EB"/>

    <circle
        cx="12"
        cy="12.5"
        r="2.5"
        fill="white"/>

</svg>

</button>

        <button
            id="retakeBtn"
            hidden>

            ↺

        </button>

        <button
            id="useBtn"
            hidden>

            ✔

        </button>

    </div>

</div>

<script src="script.js"></script>

</body>

</html>
