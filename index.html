<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>RJAB Camera</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

    <header>

        <h1>RJAB Camera</h1>

        <p class="subtitle">
            Photo Verification
        </p>

    </header>

    <div class="camera-box">

        <video
            id="camera"
            autoplay
            playsinline
            muted>
        </video>

        <canvas
            id="canvas"
            hidden>
        </canvas>

        <img
            id="preview"
            hidden>

        <div id="guide"></div>

    </div>

    <div class="buttons">

        <button id="captureBtn"></button>

        <button
            id="retakeBtn"
            hidden>

            🔄

        </button>

        <button
            id="useBtn"
            hidden>

            ✅

        </button>

    </div>

    <div id="status">

        Loading camera...

    </div>

</div>

<script src="script.js"></script>

</body>

</html>
