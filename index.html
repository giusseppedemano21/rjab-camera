<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>RJAB Camera</title>

    <link rel="stylesheet" href="style.css">
    
</head>

<body>

<div class="container">

    <!-- HEADER -->

    <header>

        <h1>RJAB Camera</h1>

        <p class="subtitle">
            Photo Verification
        </p>

    </header>

    <!-- CAMERA -->

    <div class="camera-box">

        <video
            id="camera"
            autoplay
            playsinline
            muted>
        </video>

        <canvas
            id="canvas"
            hidden>
        </canvas>

        <img
            id="preview"
            hidden>

        <!-- FACE GUIDE -->
        <div id="guide">

        <span class="corner tl"></span>
        <span class="corner tr"></span>
        <span class="corner bl"></span>
        <span class="corner br"></span>

</div>

        <!-- COUNTDOWN -->
        <div id="countdown" hidden>
            3
        </div>

        <!-- FLASH EFFECT -->
        <div id="flash"></div>

    </div>

    <!-- STATUS -->

    <div id="status">

        Loading camera...

    </div>

    <!-- BUTTONS -->

    <div class="buttons">

<button id="captureBtn">

<svg
    viewBox="0 0 24 24"
    xmlns="http://www.w3.org/2000/svg">

    <!-- Camera Body -->
    <path
        d="M7 5.5L8.8 3.5H15.2L17 5.5H19.5C20.33 5.5 21 6.17 21 7V18.5C21 19.33 20.33 20 19.5 20H4.5C3.67 20 3 19.33 3 18.5V7C3 6.17 3.67 5.5 4.5 5.5H7Z"
        fill="white"/>

    <!-- Lens -->
    <circle
        cx="12"
        cy="12.5"
        r="4.2"
        fill="#2563EB"/>

    <circle
        cx="12"
        cy="12.5"
        r="2.5"
        fill="white"/>

    <!-- Flash -->
    <circle
        cx="17.2"
        cy="8.3"
        r="0.8"
        fill="#2563EB"/>

</svg>

</button>

        <button
            id="retakeBtn"
            hidden>

            ↺

        </button>

        <button
            id="useBtn"
            hidden>

            ✔

        </button>

    </div>

</div>

<script src="script.js"></script>

</body>

</html>
