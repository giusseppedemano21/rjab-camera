<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>RJAB Camera</title>

    <link rel="stylesheet" href="stylev2.css">

</head>

<body>

<div class="container">

    <!-- HEADER -->

    <header>

        <h1>RJAB Camera</h1>

        <p class="subtitle">
            Photo Verification
        </p>

    </header>

    <!-- CAMERA -->

    <div class="camera-box">

        <!-- HUD DISPLAY -->

        <div class="hud hud-top-left">
            ● LIVE
        </div>

        <div class="hud hud-top-right">
            AI SCAN
        </div>

        <div class="hud hud-bottom-left">
            FACE READY
        </div>

        <div class="hud hud-bottom-right">
            SECURE
        </div>

        <video
            id="camera"
            autoplay
            playsinline
            muted>
        </video>

        <canvas
            id="canvas"
            hidden>
        </canvas>

        <img
            id="preview"
            hidden>

        <!-- FACE GUIDE -->

        <div id="guide">

            <span class="corner tl"></span>
            <span class="corner tr"></span>
            <span class="corner bl"></span>
            <span class="corner br"></span>

        </div>

        <!-- COUNTDOWN -->

        <div id="countdown" hidden>

            3

        </div>

        <!-- FLASH -->

        <div id="flash"></div>

        <!-- CAMERA CONTROLS -->

        <div class="buttons">

            <!-- RETAKE -->

            <button
                id="retakeBtn"
                hidden>

                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    xmlns="http://www.w3.org/2000/svg">

                    <path
                        d="M7 6L3 10L7 14"
                        stroke="#FFFFFF"
                        stroke-width="3"
                        stroke-linecap="round"
                        stroke-linejoin="round"/>

                    <path
                        d="M4 10H12
                           C16 10 19 13 19 17"
                        stroke="white"
                        stroke-width="3"
                        stroke-linecap="round"
                        stroke-linejoin="round"/>

                </svg>

            </button>

            <!-- CAPTURE -->

            <button id="captureBtn">

                <svg
                    viewBox="0 0 24 24"
                    xmlns="http://www.w3.org/2000/svg">

                    <path
                        d="M7 5.5L8.8 3.5H15.2L17 5.5H19.5C20.33 5.5 21 6.17 21 7V18.5C21 19.33 20.33 20 19.5 20H4.5C3.67 20 3 19.33 3 18.5V7C3 6.17 3.67 5.5 4.5 5.5H7Z"
                        fill="white"/>

                    <circle
                        cx="12"
                        cy="12.5"
                        r="4.2"
                        fill="#2563EB"/>

                    <circle
                        cx="12"
                        cy="12.5"
                        r="2.5"
                        fill="white"/>

                    <circle
                        cx="17.2"
                        cy="8.3"
                        r="0.8"
                        fill="#2563EB"/>

                </svg>

            </button>

            <!-- VERIFY -->

            <button
                id="useBtn"
                hidden>

                <svg
                    viewBox="0 0 24 24"
                    xmlns="http://www.w3.org/2000/svg">

                    <path
                        d="M6 12.5L10 16.5L18 8.5"
                        fill="none"
                        stroke="white"
                        stroke-width="2.8"
                        stroke-linecap="round"
                        stroke-linejoin="round"/>

                </svg>

            </button>

        </div>

    </div>

    <!-- STATUS -->

    <div id="status">

        Loading camera...

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
